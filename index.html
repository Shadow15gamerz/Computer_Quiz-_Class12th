<title>Computer Exam Quiz ( 12th )</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e2e5ec;--accent:#4f46e5;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--text:#e8eaf0;--muted:#9aa3b2;--line:#2a2f3d;--accent:#818cf8;--ok:#4ade80;--okbg:#14351f;--bad:#f87171;--badbg:#3a1717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.pill{background:var(--line);border-radius:999px;padding:4px 10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent);width:0}
.muted{color:var(--muted);font-size:13px}
.q{font-size:17px;line-height:1.5;margin:8px 0 12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;cursor:pointer;font-family:inherit}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
input.fill{width:100%;padding:12px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit}
input.fill.ok{border-color:var(--ok);background:var(--okbg)}
input.fill.bad{border-color:var(--bad);background:var(--badbg)}
.btn{padding:12px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--line);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.4}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.dot{padding:8px 0;text-align:center;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.dot.okd{background:var(--ok);color:#fff;border-color:var(--ok)}
.dot.bd{background:var(--bad);color:#fff;border-color:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.wrong{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.5}
.big{font-size:28px;font-weight:700;margin:4px 0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sum div{background:var(--bg);border-radius:10px;padding:10px;font-size:13px}
.sum b{display:block;font-size:18px}
.credit{display:block;margin:20px auto 0;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px;box-sizing:border-box}
.modal h2{font-size:18px;margin:0 0 4px}
.ch{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);text-decoration:none}
.ch:hover{border-color:var(--accent)}
.ch svg{flex-shrink:0;width:56px;height:auto}
.ch b{display:block;font-size:15px}
.ch .muted{font-size:13px}
.opt b{font-size:15px}
.st{font-size:13px;font-weight:600}
.st.y{color:var(--ok)}
.st.n{color:var(--muted)}
</style>
</head>

const CHAPTERS={
  1:{title:'Creating HTML Forms using KompoZer',rows:D},
  2:{title:'Cascading Style Sheets and Java Script',rows:D2},
  3:{title:'Designing Simple Website Using KompoZer',rows:D3},
  4:{title:'',rows:null},
  5:{title:'Introduction to M-Commerce',rows:D5},
  6:{title:'Object-Oriented Concepts',rows:D6}
};
const isAvail=n=>!!(CHAPTERS[n].rows&&CHAPTERS[n].rows.length);
let items=[],order=[],idx=0,view='start',sel=1;

function renderMenu(){
  if(view==='start'){
    app.innerHTML=`<div class="card"><div class="q" style="margin:4px 0 6px">Select Chapter</div>
      <div class="muted">Chapters marked Not Available have no questions added yet.</div>
      ${[1,2,3,4,5,6].map(n=>`<button class="opt" onclick="pickChapter(${n})"><b>Chapter ${n}</b><br><span class="st ${isAvail(n)?'y':'n'}">${isAvail(n)?'Available':'Not Available'}</span></button>`).join('')}
      <div id="cmsg"></div></div>`;
    return;
  }
  const c=CHAPTERS[sel];
  app.innerHTML=`<div class="card"><div class="muted">Selected chapter</div>
      <div class="q" style="margin:4px 0 12px"><b>Chapter ${sel}</b>${c.title?' · '+esc(c.title):''}</div>
      <div class="row" style="margin-top:0"><button class="btn" onclick="start(false)">Start in Order</button><button class="btn" onclick="start(true)">Shuffle and Start</button></div>
      <div class="row"><button class="btn sec" onclick="view='start';render()">← Chapters</button></div></div>`;
}
function pickChapter(n){
  if(!isAvail(n)){
    $('cmsg').innerHTML=`<div class="fb bad">Chapter ${n} is not available. Its questions have not been added yet.</div>`;
    return;
  }
  sel=n;view='options';render();
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).trim().replace(/\s+/g,' ').toLowerCase();
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cur=()=>items[order[idx]];
const PRAISE=['Well done!','Nice work!','Spot on!','Great, keep going!'];

// Build question objects. Options are shuffled while the correct answer text is tracked,
// so the answer always follows its option. Options that refer to other positions
// ("above", "both", "none") are never shuffled, since their meaning depends on position.
function mk(rows){
  return rows.map((r,i)=>{
    const [t,q,o,a]=r;
    const it={n:i+1,t,q,given:null,ok:null};
    if(t==='m'){
      const arr=o.split('|');
      it.correct=arr[a];
      it.opts=/above|both|none/i.test(o)?arr:sh(arr);
    }else{
      it.correct=o.split('/')[0];
      it.alts=o.split('/').map(norm);
    }
    return it;
  });
}
function start(shuffle){
  items=mk(CHAPTERS[sel].rows);
  order=shuffle?sh(items.map((_,i)=>i)):items.map((_,i)=>i);
  idx=0;view='quiz';render();
}
function retryWrong(){
  const wrong=items.filter(x=>x.ok===false).map(x=>({...x,given:null,ok:null}));
  items=wrong;order=sh(items.map((_,i)=>i));idx=0;view='quiz';render();
}
function pick(k){
  const it=cur();if(it.ok!==null)return;
  it.given=it.opts[k];it.ok=it.given===it.correct;render();
}
function submitFill(){
  const it=cur();if(it.ok!==null)return;
  const v=$('fi').value;if(!v.trim())return;
  it.given=v;it.ok=it.alts.includes(norm(v));render();
}
function next(){
  if(idx<order.length-1){idx++;render()}else{view='results';render()}
}
function prev(){if(idx>0){idx--;render()}}
function go(i){idx=i;view='quiz';render();window.scrollTo(0,0)}

function fb(it){
  if(it.ok===true)return `<div class="fb ok">✓ ${PRAISE[it.n%PRAISE.length]} <br>Correct Answer: ${esc(it.correct)}</div>`;
  return `<div class="fb bad">✗ Incorrect. <br>Correct Answer: ${esc(it.correct)}</div>`;
}

function render(){
  const app=$('app');
  if(view==='start'||view==='options'){
    renderMenu();
    return;
  }
  const N=items.length;
  const answered=items.filter(x=>x.ok!==null).length;
  const c=items.filter(x=>x.ok===true).length;
  const w=answered-c;
  if(view==='results'){
    const pct=Math.round(c/N*100);
    const wrong=items.filter(x=>x.ok===false);
    app.innerHTML=`<div class="card">
      <div class="muted">Final Result</div>
      <div class="big">${c}/${N}</div>
      <div>${pct}%</div>
      <div class="sum">
        <div>Total questions<b>${N}</b></div>
        <div>Correct<b>${c}</b></div>
        <div>Incorrect<b>${w}</b></div>
        <div>Unanswered<b>${N-answered}</b></div>
      </div>
      <div class="row">
        ${wrong.length?`<button class="btn" onclick="retryWrong()">Retry incorrect (${wrong.length})</button>`:''}
        <button class="btn sec" onclick="start(true)">Reshuffle &amp; restart</button>
        <button class="btn sec" onclick="go(0)">Review answers</button>
        <button class="btn sec" onclick="view='start';render()">Chapters</button>
      </div>
    </div>
    ${wrong.length?`<div class="card"><b>Questions answered incorrectly</b>${wrong.map(x=>`<div class="wrong"><b>Q${x.n}.</b> ${esc(x.q)}<br>Your answer: ${esc(x.given)}<br>Correct answer: ${esc(x.correct)}</div>`).join('')}</div>`:'<div class="card">Every answered question was correct.</div>'}`;
    return;
  }
  const it=cur();
  const pct=Math.round(answered/N*100);
  let body='';
  if(it.t==='m'){
    body=it.opts.map((o,k)=>{
      let cls='opt';
      if(it.ok!==null){if(o===it.correct)cls+=' ok';else if(o===it.given)cls+=' bad';}
      return `<button class="${cls}" ${it.ok!==null?'disabled':''} onclick="pick(${k})">${esc(o)}</button>`;
    }).join('');
  }else{
    const cls=it.ok===null?'':(it.ok?' ok':' bad');
    body=`<input id="fi" class="fill${cls}" type="text" placeholder="Type your answer" autocomplete="off" autocapitalize="off" ${it.ok!==null?'disabled':''} value="${it.given!==null?esc(it.given):''}" onkeydown="if(event.key==='Enter')submitFill()">
      ${it.ok===null?`<div class="row"><button class="btn" onclick="submitFill()">Submit</button></div>`:''}`;
  }
  const feedback=it.ok===null?'':fb(it);
  const grid=order.map((oi,p)=>{
    const x=items[oi];
    let cls='dot';
    if(x.ok===true)cls+=' okd';else if(x.ok===false)cls+=' bd';
    if(p===idx)cls+=' cur';
    return `<button class="${cls}" onclick="go(${p})">${p+1}</button>`;
  }).join('');
  const last=idx===N-1;
  app.innerHTML=`
    <div class="card">
      <div class="stats">
        <span class="pill">Score ${c}/${N}</span>
        <span class="pill">Question ${idx+1} of ${N}</span>
        <span class="pill">Correct ${c}</span>
        <span class="pill">Incorrect ${w}</span>
        <span class="pill">Done ${pct}%</span>
      </div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="muted" style="margin-top:6px">Question ${idx+1} · ${it.t==='m'?'Multiple choice':'Full form'} · Original #${it.n}</div>
    </div>
    <div class="card">
      <div class="q">${idx+1}. ${esc(it.q)}</div>
      ${body}
      ${feedback}
      <div class="row">
        <button class="btn sec" onclick="prev()" ${idx===0?'disabled':''}>← Previous</button>
        ${last
          ? `<button class="btn" onclick="view='results';render()" ${it.ok===null?'disabled':''}>See results</button>`
          : `<button class="btn" onclick="next()" ${it.ok===null?'disabled':''}>Next →</button>`}
      </div>
      ${it.ok===null?'<div class="muted" style="margin-top:8px">Answer this question to unlock Next.</div>':''}
    </div>
    <div class="card">
      <div class="row" style="margin-top:0"><b>Navigator</b><button class="btn small sec" onclick="view='start';render()">Chapters</button> <button class="btn small sec" onclick="view='results';render()">Results so far</button></div>
      <div class="muted" style="margin-top:4px">Green = correct, red = incorrect, outlined = current. Tap a number to review or change nothing.</div>
      <div class="grid">${grid}</div>
    </div>`;
}
render();
function openCredit(){$('credit').classList.add('open')}
function closeCredit(){$('credit').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCredit()});
</script>
